name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # requirements.txt is the authoritative pinned set (pyproject has no dev extra)
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -e . --no-deps

      - name: Ruff lint
        run: ruff check . --exclude .venv,scripts,claude-code-proxy

      - name: Ruff format check
        # Scoped to pipeline code (repo-wide format debt predates this gate)
        run: ruff format --check agents/ bus/ contracts/ orchestrator/ runtime/ memory/ training/ serving/ shared/ evaluation/ learning/ research/ prometheus/

      - name: Registry validation
        run: pytest tests/validators/ -v
