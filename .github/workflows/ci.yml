name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REDIS_VERSION: "7"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pre-commit
      - name: Ruff check
        run: ruff check . --ignore E501,F403,F401,E402,E741,F841,F541 --exclude .venv,scripts,claude-code-proxy,training_script_test-job-cache.py,training_script_test-job-template.py
      # NOTE: pre-commit is kept as a local hook only — `pre-commit run --all-files`
      # fails on pre-existing format debt (87 files) and would mask real breakage.
      # Repo-wide format cleanup is a separate hygiene task; new code must pass
      # `ruff format --check` on the files it touches.

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create directories
        run: mkdir -p scripts data outputs
      - name: Run unit + validators + services tests (failures fail the build)
        run: python -m pytest tests/unit tests/validators tests/services -v --timeout=300
