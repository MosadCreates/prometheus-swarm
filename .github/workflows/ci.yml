name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
      chromadb:
        image: chromadb/chroma:0.5.0
        ports:
          - "8000:8000"
        env:
          ALLOW_RESET: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: |
          cp .env.example .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
      - run: pytest tests/ -v --tb=short -x --timeout=120
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Syntax check
        run: |
          python -c "
          import ast, sys
          files = [
            'agents/llm_client.py', 'bus/publisher.py',
            'agents/scout/tools.py', 'agents/forge/decision_tree.py',
            'agents/dissect/taxonomy.py',
          ]
          for f in files:
            try:
              ast.parse(open(f).read())
              print(f'{f}: OK')
            except SyntaxError as e:
              print(f'{f}: SYNTAX ERROR — {e}')
              sys.exit(1)
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --line-length=100 .
