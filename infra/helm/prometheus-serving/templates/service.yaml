apiVersion: v1
kind: Service
metadata:
  name: "{{ include "prometheus-serving.fullname" . }}-service"
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "prometheus-serving.name" . | quote }}
    release: {{ .Release.Name | quote }}
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    app: {{ include "prometheus-serving.name" . | quote }}
  ports:
  - protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
