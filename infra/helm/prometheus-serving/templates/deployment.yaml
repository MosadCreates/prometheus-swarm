apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus-serving.fullname" . | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app: {{ include "prometheus-serving.name" . | quote }}
    release: {{ .Release.Name | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "prometheus-serving.name" . | quote }}
  template:
    metadata:
      labels:
        app: {{ include "prometheus-serving.name" . | quote }}
        release: {{ .Release.Name | quote }}
    spec:
      containers:
      - name: serving
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        env:
          {{- range $key, $value := .Values.env }}
          - name: {{ $key | quote }}
            value: {{ $value | quote }}
          {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- with .Values.nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
