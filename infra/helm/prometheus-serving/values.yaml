# Default values for prometheus-serving.
# Set image.repository + image.tag to the pushed registry image (see .env REGISTRY_URL).
replicaCount: 2

image:
  repository: gcr.io/nexora/prometheus-serving
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Passed to the serving container as env. Kept minimal — the serving app reads
# its own .env defaults and only needs these when drift monitoring is configured.
env:
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"

# Drift monitoring configuration (PSI). Mirrors SERVING_* env vars.
drift:
  psiIntervalSeconds: 3600
  psiWindowSize: 1000
  psiThreshold: 0.2

nodeSelector: {}
tolerations: []
affinity: {}
