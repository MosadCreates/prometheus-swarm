# Prometheus scraping configuration for Prometheus Swarm
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus-swarm-orchestrator"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  - job_name: "prometheus-swarm-serving"
    static_configs:
      - targets: ["localhost:8080"]
    metrics_path: /metrics

  - job_name: "prometheus-swarm-docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]
