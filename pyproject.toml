[project]
name = "prometheus-swarm"
version = "0.1.0"
requires-python = ">=3.11"
description = "Autonomous multi-agent ML pipeline system"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.black]
line-length = 100
