[project]
name = "prometheus-swarm"
version = "0.1.0"
requires-python = ">=3.11"
description = "Autonomous multi-agent ML pipeline system"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "shellingham>=1.5",
    "anthropic>=0.113",
    "httpx>=0.28",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "transformers>=4.41",
    "optuna>=3.6",
    "imbalanced-learn>=0.12",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "redis>=5.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxmltools>=1.12",
    "onnxconverter-common>=1.16",
    "skl2onnx>=1.20",
    "docker>=7.1",
    "prometheus-client>=0.20",
    "filelock>=3.15",
    "scipy>=1.13",
    "jinja2>=3.1",
    "pyreadline3>=3.5",
    "textual>=0.52",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[project.scripts]
prometheus = "prometheus.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prometheus*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "validation: Registry and CLI structural validation tests.",
    "training_exec: Slow execution tests that run rendered training scripts against real data.",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.black]
line-length = 100
